<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>TikTok Coins Exchange</title>

  <style>
    :root {
      --pink: #fe2c55;
      --text: #17171a;
      --muted: #85858d;
      --line: #ededf0;
      --soft: #f7f7f8;
      --green: #16b979;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f3f3f3;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      margin: auto;
      background: #fff;
      padding: 20px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0 22px;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
      font-weight: 500;
    }

    .back {
      font-size: 38px;
      color: #333;
    }

    .balance {
      text-align: center;
      padding: 15px 0 25px;
    }

    .balance-label {
      color: var(--muted);
      font-size: 18px;
      margin-bottom: 10px;
    }

    .balance-number {
      font-size: 43px;
      letter-spacing: -1px;
      font-weight: 400;
    }

    .balance-coins {
      color: var(--muted);
      font-size: 16px;
      margin-top: 9px;
    }

    .search-title {
      font-size: 18px;
      font-weight: 600;
      margin: 10px 0;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 56px;
      border: 2px solid #f0a7bc;
      border-radius: 30px;
      padding: 0 17px;
    }

    .search-box:focus-within {
      border-color: var(--pink);
      box-shadow: 0 0 0 3px #fe2c5518;
    }

    .search-box span {
      color: var(--muted);
      font-size: 21px;
    }

    .search-box input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 17px;
    }

    .status {
      min-height: 24px;
      padding: 12px 4px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .status.error {
      color: #d62950;
    }

    .status.success {
      color: var(--green);
    }

    .loader {
      display: none;
      text-align: center;
      color: var(--muted);
      padding: 18px;
      font-size: 13px;
    }

    .loader.show {
      display: block;
    }

    .spinner {
      width: 30px;
      height: 30px;
      margin: 0 auto 9px;
      border: 4px solid #f5d6df;
      border-top-color: var(--pink);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .profile {
      display: none;
      margin-top: 8px;
      padding: 18px 0;
      border-top: 1px solid var(--line);
    }

    .profile.show {
      display: block;
    }

    .profile-top {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .avatar {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      object-fit: cover;
      background: #e6e8eb;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px #dfe1e4;
    }

    .profile-name {
      font-size: 18px;
      font-weight: 700;
    }

    .profile-handle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 14px;
    }

    .verified {
      display: inline-block;
      margin-left: 4px;
      color: #20aee5;
    }

    .profile-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 17px;
      padding-top: 13px;
      border-top: 1px solid var(--line);
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 16px;
    }

    .stat span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .bio {
      margin: 15px 0;
      color: #55575d;
      font-size: 14px;
      line-height: 1.4;
    }

    .send-box {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .send-box label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .amount {
      width: 100%;
      padding: 12px;
      border: 1px solid #dfe1e4;
      border-radius: 10px;
      outline: 0;
      font-size: 18px;
    }

    .amount:focus {
      border-color: var(--pink);
    }

    .send-button {
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      color: white;
      background: var(--pink);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .send-button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .notice {
      margin-top: 25px;
      padding: 13px;
      border-radius: 10px;
      background: var(--soft);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
    }
  </style>
</head>

<body>
  <main class="app">
    <header>
      <div class="back">‹</div>
      <h1>Exchange</h1>
      <div></div>
    </header>

    <section class="balance">
      <div class="balance-label">TikTok Coins Balance</div>
      <div class="balance-number" id="balanceNumber">6,691,736,649</div>
      <div class="balance-coins">Coins disponibles para intercambiar</div>
    </section>

    <div class="search-title">Buscar usuario de TikTok</div>

    <div class="search-box">
      <span>@</span>
      <input
        id="usernameInput"
        type="text"
        placeholder="Escribe el nombre de usuario"
        autocomplete="off"
        spellcheck="false"
      >
    </div>

    <div class="status" id="status"></div>

    <div class="loader" id="loader">
      <div class="spinner"></div>
      Buscando datos reales...
    </div>

    <section class="profile" id="profile">
      <div class="profile-top">
        <img class="avatar" id="avatar" alt="Foto de perfil">

        <div>
          <div class="profile-name" id="profileName"></div>
          <div class="profile-handle" id="profileHandle"></div>
        </div>
      </div>

      <div class="profile-stats">
        <div class="stat">
          <strong id="following">—</strong>
          <span>Siguiendo</span>
        </div>

        <div class="stat">
          <strong id="followers">—</strong>
          <span>Seguidores</span>
        </div>

        <div class="stat">
          <strong id="likes">—</strong>
          <span>Me gusta</span>
        </div>
      </div>

      <div class="bio" id="bio"></div>

      <div class="send-box">
        <label for="amount">Cantidad de coins para enviar</label>

        <input
          id="amount"
          class="amount"
          type="number"
          min="1"
          step="1"
          value="100"
        >

        <button class="send-button" id="sendButton">
          Enviar coins
        </button>
      </div>
    </section>

    <div class="notice">
      Modo simulación. No se envían coins reales ni se modifica ninguna cuenta de TikTok.
    </div>
  </main>

  <script>
    "use strict";

    const USERNAME_REGEX = /^[A-Za-z0-9._]{2,24}$/;

    let currentProfile = null;
    let requestController = null;
    let requestNumber = 0;
    let searchTimer = null;
    let coinBalance = 6691736649;

    const usernameInput = document.getElementById("usernameInput");
    const statusBox = document.getElementById("status");
    const loader = document.getElementById("loader");
    const profileBox = document.getElementById("profile");
    const avatar = document.getElementById("avatar");
    const profileName = document.getElementById("profileName");
    const profileHandle = document.getElementById("profileHandle");
    const following = document.getElementById("following");
    const followers = document.getElementById("followers");
    const likes = document.getElementById("likes");
    const bio = document.getElementById("bio");
    const amount = document.getElementById("amount");
    const sendButton = document.getElementById("sendButton");
    const balanceNumber = document.getElementById("balanceNumber");

    function formatNumber(value) {
      if (value === null || value === undefined || value === "") {
        return "—";
      }

      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "—";
      }

      return number.toLocaleString("en-US");
    }

    function normalizeUsername(value) {
      return String(value || "").trim().replace(/^@+/, "");
    }

    function setStatus(message, type) {
      statusBox.textContent = message || "";
      statusBox.className = "status";

      if (type) {
        statusBox.classList.add(type);
      }
    }

    function showLoader(show) {
      loader.classList.toggle("show", show);
    }

    function clearProfile() {
      currentProfile = null;
      profileBox.classList.remove("show");
      sendButton.disabled = true;
    }

    function showError(responseStatus, providerError) {
      if (responseStatus === 400) {
        return "Nombre inválido. Usa solo letras, números, puntos y guion bajo.";
      }

      if (responseStatus === 404) {
        return "No se encontró ese perfil de TikTok.";
      }

      if (responseStatus === 429) {
        return "Demasiadas consultas. Espera un momento y vuelve a intentarlo.";
      }

      if (responseStatus === 504) {
        return "La consulta tardó demasiado. Inténtalo nuevamente.";
      }

      if (providerError === "APIFY_TOKEN is not configured") {
        return "La función de Netlify no tiene configurado APIFY_TOKEN.";
      }

      return "No se pudo consultar TikTok en este momento.";
    }

    function renderProfile(profile) {
      currentProfile = profile;
      profileBox.classList.add("show");

      profileName.textContent =
        profile.name || profile.handle || "Perfil de TikTok";

      profileHandle.textContent = "@" + (profile.handle || "");

      if (profile.verified) {
        profileHandle.textContent += " ✓";
      }

      following.textContent = formatNumber(profile.following);
      followers.textContent = formatNumber(profile.followers);
      likes.textContent = formatNumber(profile.likes);
      bio.textContent = profile.bio || "";

      const imageUrl = String(profile.avatar || "");

      if (/^https?:\/\/[^\s]+$/i.test(imageUrl)) {
        avatar.src = imageUrl;
        avatar.style.visibility = "visible";
      } else {
        avatar.removeAttribute("src");
        avatar.style.visibility = "hidden";
      }

      sendButton.disabled = false;
    }

    async function searchProfile() {
      const username = normalizeUsername(usernameInput.value);

      if (!USERNAME_REGEX.test(username)) {
        clearProfile();

        if (username.length > 0) {
          setStatus(
            "Nombre inválido. Usa de 2 a 24 caracteres: letras, números, punto o guion bajo.",
            "error"
          );
        } else {
          setStatus("");
        }

        return;
      }

      if (requestController) {
        requestController.abort();
      }

      requestController = new AbortController();

      const thisRequest = ++requestNumber;
      clearProfile();
      showLoader(true);
      setStatus("Consultando datos públicos en vivo...");

      try {
        const query = new URLSearchParams({
          username: username
        });

        const response = await fetch(
          "/api/tiktok-profile?" + query.toString(),
          {
            method: "GET",
            cache: "no-store",
            headers: {
              "Accept": "application/json",
              "Cache-Control": "no-cache"
            },
            signal: requestController.signal
          }
        );

        let data = null;

        try {
          data = await response.json();
        } catch {
          data = null;
        }

        if (thisRequest !== requestNumber) {
          return;
        }

        if (!response.ok || !data || data.ok !== true || !data.profile) {
          const message = showError(
            response.status,
            data ? data.error : ""
          );

          setStatus(message, "error");
          clearProfile();
          return;
        }

        renderProfile(data.profile);
        setStatus("Datos actualizados en vivo.", "success");
      } catch (error) {
        if (error.name === "AbortError") {
          return;
        }

        if (thisRequest !== requestNumber) {
          return;
        }

        clearProfile();
        setStatus(
          "Error de conexión. Comprueba Internet e inténtalo otra vez.",
          "error"
        );
      } finally {
        if (thisRequest === requestNumber) {
          showLoader(false);
        }
      }
    }

    usernameInput.addEventListener("input", function() {
      clearTimeout(searchTimer);

      searchTimer = setTimeout(function() {
        searchProfile();
      }, 350);
    });

    usernameInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        clearTimeout(searchTimer);
        searchProfile();
      }
    });

    sendButton.addEventListener("click", function() {
      const requestedAmount = Math.floor(Number(amount.value));

      if (!currentProfile) {
        setStatus("Primero busca un perfil válido.", "error");
        return;
      }

      if (!Number.isFinite(requestedAmount) || requestedAmount < 1) {
        setStatus("Escribe una cantidad válida de coins.", "error");
        return;
      }

      if (requestedAmount > coinBalance) {
        setStatus("No tienes suficientes coins en la simulación.", "error");
        return;
      }

      coinBalance -= requestedAmount;
      balanceNumber.textContent = coinBalance.toLocaleString("en-US");

      setStatus(
        requestedAmount.toLocaleString("en-US") +
        " coins enviados a @" +
        currentProfile.handle +
        " en modo simulación.",
        "success"
      );
    });

    avatar.addEventListener("error", function() {
      avatar.removeAttribute("src");
      avatar.style.visibility = "hidden";
    });

    sendButton.disabled = true;
  </script>
</body>
</html>
